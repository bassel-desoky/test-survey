<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quick Survey Test</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f4f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
      max-width: 420px;
      width: 100%;
    }
    h2 {
      margin-top: 0;
      color: #333;
      font-size: 20px;
    }
    .question {
      margin-bottom: 24px;
    }
    label.title {
      display: block;
      font-weight: 600;
      margin-bottom: 10px;
      color: #222;
    }
    .radio-group label {
      display: inline-flex;
      align-items: center;
      margin-right: 20px;
      cursor: pointer;
      font-weight: 500;
    }
    .radio-group input {
      margin-right: 6px;
    }
    select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
      background: #fff;
    }
    button {
      width: 100%;
      background: #0066ff;
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover {
      background: #0052cc;
    }
    #result {
      margin-top: 20px;
      padding: 12px;
      border-radius: 6px;
      background: #eef7ee;
      color: #2e7d32;
      display: none;
      font-size: 14px;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Quick Survey</h2>
    <form id="surveyForm">
      
      <!-- Question 1 -->
      <div class="question">
        <label class="title">1. Test survey one</label>
        <div class="radio-group">
          <label><input type="radio" name="q1" value="Yes" required /> Yes</label>
          <label><input type="radio" name="q1" value="No" /> No</label>
        </div>
      </div>

      <!-- Question 2 -->
      <div class="question">
        <label class="title" for="q2">2. Test drop down</label>
        <select id="q2" name="q2" required>
          <option value="" disabled selected>Select from test list...</option>
          <option value="Test List Item 1">Test List Item 1</option>
          <option value="Test List Item 2">Test List Item 2</option>
          <option value="Test List Item 3">Test List Item 3</option>
        </select>
      </div>

      <button type="submit">Submit Test</button>
    </form>

    <div id="result"></div>
  </div>

  <script>
    document.getElementById("surveyForm").addEventListener("submit", function(e) {
      e.preventDefault();
      const q1 = document.querySelector('input[name="q1"]:checked').value;
      const q2 = document.getElementById("q2").value;

      const resultBox = document.getElementById("result");
      resultBox.innerHTML = `<strong>Survey Submitted!</strong><br>• Question 1: ${q1}<br>• Question 2: ${q2}`;
      resultBox.style.display = "block";
    });
  </script>

</body>
</html>
